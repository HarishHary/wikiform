[project]
name = "wikiform"
version = "1.0.0"
description = "Wiki vault maintenance CLI - index, lint, and search your wiki."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Harish SEGAR", email = "segharish@gmail.com" }]
keywords = [
    "wiki",
    "knowledge management",
    "LLM",
    "obsidian",
    "markdown",
    "FTS5",
]
classifiers = ["Programming Language :: Python :: 3.14"]
dependencies = [
    "click>=8.5.1,<9",
    "python-frontmatter>=1.3.0,<2",
    "loguru>=0.8.0,<0.9",
    "rich>=15.0.0,<16",
    "markitdown[pdf,docx,xlsx,xls,pptx]>=0.1.9,<0.2",
    "opendataloader-pdf>=2.5.22,<3",
    "sqlite-vec>=0.1.9,<0.2",
    "sentence-transformers>=6.3.0,<7",
    "requests>=2.34.2,<3",
    "trafilatura>=2.3.1,<3",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4,<2",
    "black>=26.10.1,<27",
    "flake8>=7.5.0,<8",
    "pre-commit>=4.7.0,<5",
    "pytest>=9.2.0,<10",
    "pytest-cov==7.1.0",
    "ruff>=0.17.5,<0.18",
    "wheel>=0.48.0,<0.49",
    "yamllint>=1.38.0,<2",
    "twine>=7.0.0,<8",
]

[project.urls]
homepage = "https://github.com/wikiform/wikiform"
repository = "https://github.com/wikiform/wikiform"
documentation = "https://github.com/wikiform/wikiform"
issues = "https://github.com/wikiform/wikiform/issues"
changelog = "https://github.com/wikiform/wikiform/blob/main/CHANGELOG.md"

[project.scripts]
wikiform = "wikiform.cli:cli"

[tool.pytest.ini_options]
addopts = ""
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["wikiform"]
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.ruff]
line-length = 160
exclude = ["tests"]

[tool.ruff.lint]
# Linter rule sets
select = [
    "E",   # pycodestyle (errors)
    "F",   # pyflakes
    "W",   # pycodestyle (warnings)
    "B",   # flake8-bugbear
    "S",   # bandit (security)
    "I",   # isort-compatible import sorting
    "UP",  # pyupgrade
    "C90", # mccabe complexity
]

# Ignore specific rules
ignore = [
    "E203",  # Whitespace before ':'
    "E501",  # Line length (handled by formatter)
    "E701",  # Multiple statements on one line (if/else/for)
    "UP007", # Union type annotation
    "C901",  # Function is too complex
    "B006",  # Do not use mutable data structures for argument defaults
    "S105",  # Possible hardcoded password assigned
]

# Formatter (Black-compatible)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikiform"]

[tool.hatch.build.targets.sdist]
include = ["wikiform", "README.md", "pyproject.toml"]
